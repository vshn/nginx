name: Create and publish a container image

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      # The image is released as <nginx-version>.<revision>, like vshn/antora, so a change to
      # default.conf gets its own release instead of overwriting the tag of the nginx version it
      # happens to sit on. Bump REVISION when the config changes and the nginx version has not.
      - name: Determine image version
        id: nginx
        run: |
          NGINX_VERSION=$(sed -n 's/^FROM docker\.io\/nginx:\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' Dockerfile)
          REVISION=$(tr -d '[:space:]' < REVISION)
          if [ -z "$NGINX_VERSION" ] || [ -z "$REVISION" ]; then
            echo "cannot determine version: nginx='$NGINX_VERSION' revision='$REVISION'" >&2
            exit 1
          fi
          echo "version=${NGINX_VERSION}.${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Create git tag and release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.nginx.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "Tag $VERSION already exists, skipping"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
            gh release create "$VERSION" --title "$VERSION" --generate-notes
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=${{ steps.nginx.outputs.version }},enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
