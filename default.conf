server {
    # users are not allowed to listen on privileged ports
    listen 8080;
    server_name  localhost;

    absolute_redirect off; # disable absolute redirects since this nginx will run behind the kubernetes ingress load balancer handling https for us. With this enabled, the redirects e.g. from https://kb.vshn.ch/app-catalog will be wrongly generated to http://kb.vshn.ch:8080/app-catalog/ because nginx runs http on port 8080 behind the ingress handling https at default port 443.

    large_client_header_buffers 4 16k; # oauth proxies can exceed the default 8k request size due to excessive cookie data

    include /etc/nginx/antora/*.conf;

    # enable compression for all html, css and javascript
    gzip on;
    # text/html is always compressed and must not be listed here.
    # nginx serves .xml as text/xml and .txt as text/plain, so sitemap.xml and robots.txt
    # need those two types, not application/xml.
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml
               text/xml application/xml text/plain;
    gzip_min_length 256;
    gzip_vary on;

    # 404 error page
    error_page 404 =404 /404.html;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Files whose name carries a hash of their content can be cached for good: a changed file
    # is a different URL. The Antora UI bundle names its CSS and JavaScript this way
    # (site-61dfda19.css), and Pagefind names its index chunks and fragments this way.
    location ~* "-[0-9a-f]{8}\.(css|js)$" {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/pagefind/(index|fragment)/ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pagefind's runtime keeps stable names, so it is revalidated instead
    location ~* ^/pagefind/.*\.(js|json)$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Fonts and images change rarely, and their content can change under the same name,
    # so they get a week rather than forever
    location ~* \.(woff2?|ttf|eot|jpe?g|png|gif|ico|svg|webp|pdf)$ {
        root   /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Pages change with every build and carry the URLs of everything above, so they are the one
    # thing that must not be cached for long. A few minutes still helps: inside that window a
    # reader clicking back and forth spends no round trip at all, which on an HTTP/1.1 route is
    # most of the wait. After it, the browser revalidates and nginx answers 304 from the ETag.
    # A reload revalidates whatever the age, so an author checking a fresh deploy still sees it.
    location ~* \.html$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Redirect all searches to the Node.js app
    # in the other container of the same pod.
    location /search {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Plausible analytics, proxied through this site's own domain: the browser never contacts
    # plausible.io, so there is no third-party script for a blocker to drop and no CSP exception.
    # Plausible sets no cookies and stores no personal data, so a site using it still needs no
    # consent banner. A site turns this on by setting keys.plausibleScript in its playbook;
    # without that key no page references either path and nothing reaches these locations.
    # The host is spelled out rather than built from a variable, so nginx resolves it at startup
    # and no resolver directive is needed.
    location = /js/script.js {
        proxy_pass https://plausible.io/js/script.js;
        proxy_set_header Host plausible.io;
        proxy_ssl_name plausible.io;
        proxy_ssl_server_name on;
    }

    location = /api/event {
        proxy_pass https://plausible.io/api/event;
        proxy_set_header Host plausible.io;
        # the visitor's address arrives in X-Forwarded-For from the router; Plausible needs it for
        # the country and to count a visitor once, and hashes it rather than storing it
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_name plausible.io;
        proxy_ssl_server_name on;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
